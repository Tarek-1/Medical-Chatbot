<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>

<body>
    <div class="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="menu-item hamburger" title="Chats">
                    <svg class="icon-hamburger" viewBox="0 0 24 24" width="20" height="20" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="sidebar-menu">
                <button class="menu-item files" title="Check files">
                    <svg class="icon-files" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14,2 14,8 20,8"></polyline>
                        <circle cx="16" cy="13" r="1"></circle>
                        <circle cx="18" cy="13" r="1"></circle>
                        <circle cx="20" cy="13" r="1"></circle>
                    </svg>
                    <span>Files</span>
                </button>
                <button class="menu-item clear" title="Clear chat">
                    <svg class="icon-trash" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                    <span>Clear</span>
                </button>
            </div>
        </div>

        <!-- Main content -->
        <div class="main-content">
            <div class="chat-area">
                <!-- Welcome -->
                <div class="welcome-block" id="welcome-block">
                    <h1>Your AI-powered health assistant</h1>
                    <p>Ask me any medical question to begin.</p>
                </div>

                <!-- CHAT MESSAGES -->
                <div class="chat-container">
                    <div class="chat-messages" id="chat-box"></div>
                </div>

                <!-- INPUT BAR -->
                <form id="chat-form" class="chat-form pill-input">
                    <button type="button" class="icon-btn upload" id="upload-btn" title="Upload file">
                        <span class="plus-icon">+</span>
                    </button>
                    <input type="text" id="message-input" placeholder="Ask anything..." autocomplete="off">
                    <div class="action-icons">
                        <button type="button" class="icon-btn voice" id="voice-btn" title="Voice input">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect x="9" y="2" width="6" height="12" rx="3" />
                                <path d="M5 10v4a7 7 0 0 0 14 0v-4" />
                                <line x1="12" y1="19" x2="12" y2="22" />
                                <line x1="8" y1="22" x2="16" y2="22" />
                            </svg>
                        </button>
                        <button type="submit" class="icon-btn send" id="send-btn" title="Send">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
                                fill="white">
                                <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" />
                            </svg>
                        </button>
                        <button type="button" class="icon-btn stop" id="stop-btn" title="Stop">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14"
                                fill="white">
                                <rect x="6" y="6" width="12" height="12" rx="2" />
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
